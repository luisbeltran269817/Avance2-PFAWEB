spring.application.name=ProyectoFinalAplicacionesWeb

# Configuración de conexión a la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gamerhubDB?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=(pongan su usuario)
spring.datasource.password=(pongan su contraseña)


# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# 'update' le dice a Hibernate que cree las tablas mágicamente
spring.jpa.hibernate.ddl-auto=update