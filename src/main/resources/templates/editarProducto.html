<th:block th:replace="~{layout/admin :: layout(~{::title},~{::main})}">
    <title>Editar producto - GamerHub</title>
    <main class="editar-container">

        <form method="post" th:action="@{/admin/productos/{id}/editar(id=${productoEdicion.id})}" th:object="${productoEdicion}" enctype="application/x-www-form-urlencoded">

            <section class="editar-card">
                <h1>Editar Producto General</h1>

                <div class="credenciales">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" placeholder="Halo Infinite Steelbook Edition" required minlength="3" maxlength="100">
                </div>

                <div class="credenciales">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" th:field="*{descripcion}" rows="5" placeholder="Descripción del producto" required minlength="10" maxlength="1000"></textarea>
                </div>

                <div class="credenciales">
                    <label for="categoriaId">Categoría</label>
                    <select id="categoriaId" th:field="*{categoriaId}" required>
                        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}">Shooter</option>
                    </select>
                </div>

                <div class="editar-imagenes">
                    <p class="editar-etiqueta">Imágenes</p>

                    <div class="editar-imagen" th:each="img, i : *{imagenes}">
                        <img th:src="${img.url}" th:alt="'Imagen ' + ${i.count} + ' del producto'">
                        <div class="editar-imagen-datos">
                            <input type="hidden" th:name="'imagenes[' + ${i.index} + '].id'" th:value="${img.id}">

                            <label th:for="'url' + ${i.index}">URL:</label>
                            <input type="text" th:id="'url' + ${i.index}" th:name="'imagenes[' + ${i.index} + '].url'" th:value="${img.url}" placeholder="www.ejemplodeurl.com" required>

                            <label th:for="'principal' + ${i.index}">Principal:</label>
                            <input type="radio" th:id="'principal' + ${i.index}" name="imagenPrincipal" th:value="${i.index}" th:checked="${i.index == productoEdicion.imagenPrincipal}">

                            <label th:for="'orden' + ${i.index}">Orden:</label>
                            <input type="number" th:id="'orden' + ${i.index}" th:name="'imagenes[' + ${i.index} + '].orden'" th:value="${img.orden}" min="1" required>
                        </div>
                    </div>
                </div>
            </section>

            <section class="editar-card">
                <h2>Editar Precio de Variante</h2>
                <p>Plataforma: <span th:text="*{plataforma}">Xbox Series X/S</span></p>

                <input type="hidden" th:field="*{varianteId}">

                <div class="credenciales">
                    <label for="precio">Precio</label>
                    <input type="number" id="precio" th:field="*{precio}" placeholder="89.98" step="0.01" min="0" required>
                </div>
            </section>

            <div class="editar-acciones">
                <button type="submit" class="btn-primary">Confirmar</button>
                <a th:href="@{/admin}" class="btn-cancelar">Cancelar / Volver</a>
            </div>
        </form>
    </main>
</th:block>
