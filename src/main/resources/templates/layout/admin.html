<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Admin - GamerHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles/style.css}">
</head>

<body class="admin">

<header class="admin-header">

    <a th:href="@{/admin}" class="admin-header-marca">
        <span>←</span>
        <span>
        <strong>GamerHub</strong>
        <small>ADMIN DASHBOARD</small>
    </span>
    </a>

    <img th:src="@{/imgs/pfp.png}" alt="Foto de perfil del administrador">
</header>

<main th:replace="${content}"></main>

</body>
</html>
