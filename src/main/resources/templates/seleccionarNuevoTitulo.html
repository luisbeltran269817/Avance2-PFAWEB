<th:block th:replace="~{layout/admin :: layout(~{::title}, ~{::main})}"
          xmlns:th="http://www.thymeleaf.org">
    <title>Seleccionar opción - Admin GamerHub</title>
    <main class="admin-container">

        <section class="admin-opciones">
            <h1>Seleccione una opción</h1>
            <nav>
                <a th:href="@{/admin/productos/nuevo}" class="btn-secundario">Añadir Nuevo Producto</a>
                <a th:href="@{/admin/variantes/seleccionar}" class="btn-secundario">Añadir Variante a Producto</a>
            </nav>
        </section>

        <div class="barra-acciones">
            <a th:href="@{/admin}" class="btn-secundario">Cancelar / Volver</a>
        </div>

    </main>
</th:block>
